name: Deploy Web UI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: truccoder/web-ui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Xác thực SSH bằng khoá: VPS 3.105.195.84 là EC2, password auth tắt mặc định, đăng nhập
      # bằng file .pem. `password` để lại làm dự phòng — appleboy thử `key` trước rồi mới tới nó.
      # Secret phải có trên repo: SERVER_IP, SERVER_USER (ubuntu / ec2-user), SERVER_SSH_KEY (dán
      # nguyên nội dung file .pem, gồm cả dòng -----BEGIN/END-----). Thiếu cả hai thì appleboy
      # không có phương thức nào để thử: "unable to authenticate, attempted methods [none]".
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/socialapp
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u truccoder --password-stdin
            docker compose -f docker-compose.prod.yml pull web-ui
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
