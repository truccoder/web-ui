name: Branch CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate-and-build:
    if: "!startsWith(github.event.head_commit.message, 'Merge')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          echo "Branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^task\/[A-Za-z0-9]+.*$ ]]; then
            echo "❌ Invalid branch name format."
            exit 1
          fi

      # `github.event.head_commit.message` goes through `env:`, never straight into the script.
      # Interpolating `${{ ... }}` inline lets any character in the commit message — a quote, a
      # backtick, `$(...)` — break out of the string and run as a command (a message containing
      # `"mark as paid"` did exactly that, invoking `as`). Via `env` the runner sets it as a real
      # environment variable and the shell never re-parses it.
      - name: Validate commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"

          # Only the first line has to match — a multi-line body is fine.
          if [[ ! "${COMMIT_MSG%%$'\n'*}" =~ ^\[[A-Za-z0-9]+\] ]]; then
            echo "❌ Invalid commit message format."
            exit 1
          fi

      # `--max-warnings=0` is the whole point of this step.
      #
      # The design-system rules in `eslint.config.mjs` — the spacing ladder and the raw-hex ban —
      # are registered at severity `warn`, so plain `eslint` exits 0 with them firing. Until now
      # the only place they were enforced was `lint-staged`, which passes `--max-warnings=0` but
      # runs on the developer's machine and is skipped by `--no-verify` or by an edit made in
      # GitHub's web UI. That made this step green for exactly the commits it needed to catch.
      - name: Code Linting
        run: yarn lint --max-warnings=0

      # Before the build, because it finishes in under a second and the build takes ten.
      #
      # These are unit tests over pure logic only — no browser, no database. The Playwright suite
      # is NOT run in CI and must not be: `playwright.config.ts` explains that it reads the demo
      # database whose contents `docs/demo-script.md` quotes to the number.
      - name: Unit tests
        run: yarn test

      - name: Build project
        run: yarn build